name: Apply Patch from Gist

on:
  workflow_dispatch:
    inputs:
      gist_raw_url:
        description: 'Raw URL of the patch file (e.g. https://gist.githubusercontent.com/.../raw/upstox-integration.patch)'
        required: true

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch patch file from Gist raw URL
        run: |
          echo "Fetching patch from ${{ github.event.inputs.gist_raw_url }}"
          curl -sSL "${{ github.event.inputs.gist_raw_url }}" -o /tmp/patch.diff
          echo "Patch size:"
          ls -l /tmp/patch.diff

      - name: Create branch
        run: |
          BRANCH="feature/upstox-integration-ml"
          git checkout -b "$BRANCH"

      - name: Apply patch
        run: |
          set -e
          if git apply --index /tmp/patch.diff; then
            echo "Patch applied"
          else
            echo "::error::git apply failed; attempting git am"
            git am --keep-non-patch /tmp/patch.diff || (echo "::error::git am failed" && exit 1)
          fi

      - name: Commit & push changes
        run: |
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
          else
            git commit -m "chore: apply automated patch (Upstox integration + Malayalam translations)"
            git push --set-upstream origin HEAD
            echo "Pushed branch"
          fi
